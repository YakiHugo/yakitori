appId: com.yakitori.app
productName: Yakitori
asar: true
# Use the version already installed and verified by pnpm; packaging must not
# re-download Electron or its checksum manifest on every local/CI rebuild.
electronDist: node_modules/electron/dist
# Native dependencies are force-rebuilt before packaging by the package script.
npmRebuild: false
# The sidecar server entry runs under plain Node (ELECTRON_RUN_AS_NODE),
# which cannot read inside the asar archive — unpack the desktop bundle.
asarUnpack:
  - dist/desktop/**
  - node_modules/fs-ext/**
  - node_modules/node-pty/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/detect-libc/**
  - node_modules/semver/**
  - node_modules/@vscode/ripgrep*/**
  - node_modules/pdfjs-dist/**
  - node_modules/@napi-rs/canvas*/**
# Native addons and ripgrep remain external to resolve their runtime files.
files:
  - dist/desktop/**
  - package.json
  - "!node_modules/**"
  - node_modules/fs-ext/**
  - node_modules/node-pty/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/detect-libc/**
  - node_modules/semver/**
  - node_modules/@vscode/ripgrep*/**
  - node_modules/pdfjs-dist/**
  - node_modules/@napi-rs/canvas*/**
  # Debug maps remain in dist for local diagnosis, outside the installed app.
  - "!**/*.map"
  # The renderer bundles its own modern PDF code and worker. The Node PDF
  # worker uses only legacy/build/pdf.mjs and pdf.worker.mjs, plus data assets.
  - "!node_modules/pdfjs-dist/build/**"
  - "!node_modules/pdfjs-dist/web/**"
  - "!node_modules/pdfjs-dist/legacy/web/**"
  - "!node_modules/pdfjs-dist/image_decoders/**"
  - "!node_modules/pdfjs-dist/legacy/image_decoders/**"
  - "!node_modules/pdfjs-dist/legacy/build/*.min.mjs"
  - "!node_modules/pdfjs-dist/legacy/build/pdf.sandbox.mjs"
  - "!node_modules/pdfjs-dist/legacy/build/*.d.mts"
  - "!node_modules/pdfjs-dist/**/webpack.mjs"
  - "!node_modules/pdfjs-dist/CODE_OF_CONDUCT.md"
extraResources:
  - from: dist/native
    to: computer
  - from: dist/gui
    to: gui
    filter:
      - "**/*"
      - "!**/*.map"
mac:
  icon: assets/app-icon/icon.icns
  category: public.app-category.developer-tools
  target:
    - dir
directories:
  output: release
