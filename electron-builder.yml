appId: com.yakitori.app
productName: Yakitori
asar: true
# Native dependencies are force-rebuilt before packaging by the package script.
npmRebuild: false
# The sidecar server entry runs under plain Node (ELECTRON_RUN_AS_NODE),
# which cannot read inside the asar archive — unpack the desktop bundle.
asarUnpack:
  - dist/desktop/**
  - node_modules/fs-ext/**
  - node_modules/node-pty/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/detect-libc/**
  - node_modules/semver/**
  - node_modules/@vscode/ripgrep*/**
# Native addons and ripgrep remain external to resolve their runtime files.
files:
  - dist/desktop/**
  - package.json
  - "!node_modules/**"
  - node_modules/fs-ext/**
  - node_modules/node-pty/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/detect-libc/**
  - node_modules/semver/**
  - node_modules/@vscode/ripgrep*/**
extraResources:
  - from: dist/gui
    to: gui
mac:
  category: public.app-category.developer-tools
  target:
    - dir
directories:
  output: release
