appId: com.yakitori.app
productName: Yakitori
asar: true
# Native dependencies are force-rebuilt before packaging by the package script.
npmRebuild: false
# The sidecar server entry runs under plain Node (ELECTRON_RUN_AS_NODE),
# which cannot read inside the asar archive — unpack the desktop bundle.
asarUnpack:
  - dist/desktop/**
  - node_modules/fs-ext/**
  - node_modules/node-pty/**
# JavaScript dependencies are inlined. Native addons remain external because
# they must be rebuilt against and loaded by Electron's Node runtime.
files:
  - dist/desktop/**
  - package.json
  - "!node_modules/**"
  - node_modules/fs-ext/**
  - node_modules/node-pty/**
extraResources:
  - from: dist/gui
    to: gui
mac:
  category: public.app-category.developer-tools
  target:
    - dir
directories:
  output: release
