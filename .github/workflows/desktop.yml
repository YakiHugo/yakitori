name: Desktop

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    # Implementation safety bound for cold Electron downloads and native builds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify macOS shell and sidecar behavior
        run: pnpm test test/runtime/user-shell-env.test.ts test/runtime/tools/unified-exec.test.ts test/desktop/server-process.test.ts

      - name: Package the desktop app
        run: pnpm package:desktop

      - name: Verify the packaged Electron app
        run: pnpm test:desktop-smoke

      - name: Upload desktop failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          name: yakitori-macos-arm64
          path: release/mac-arm64
          retention-days: 14
