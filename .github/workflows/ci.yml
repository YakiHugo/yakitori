name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede older PR checks; every main commit keeps its own full validation.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-build:
    runs-on: ubuntu-latest
    # Implementation safety bound: ordinary CI took about two minutes; leave
    # room for cold dependency/browser downloads without allowing a stuck job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build renderer and desktop bundles
        run: pnpm build

      - name: Install Chromium
        run: |
          # Chromium's libraries come from Ubuntu. Unrelated runner repositories
          # must not block this installation when their indexes are broken.
          printf '%s\n' 'Dir::Etc::sourcelist "sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99yakitori-sources > /dev/null
          pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify the renderer in Chromium
        run: pnpm test:browser

      - name: Upload browser failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests (${{ matrix.layer }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        layer: [contracts, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the ${{ matrix.layer }} test layer
        run: pnpm test:${{ matrix.layer }} --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-${{ matrix.layer }}.xml

      - name: Upload test failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.layer }}-failure-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    uses: ./.github/workflows/desktop.yml

  required:
    name: CI required
    if: always()
    needs: [quality-build, tests, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          QUALITY_BUILD: ${{ needs.quality-build.result }}
          TESTS: ${{ needs.tests.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: |
          echo "quality-build=$QUALITY_BUILD tests=$TESTS desktop=$DESKTOP"
          if [[ "$QUALITY_BUILD" != success || "$TESTS" != success || "$DESKTOP" != success ]]; then
            exit 1
          fi

  publish-desktop:
    name: Publish validated desktop update
    needs: [required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yakitori-macos-arm64
          path: release

      - name: Publish a unique desktop main prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A partial rerun can reuse an earlier successful desktop artifact.
          # Keep the tag tied to that build's identity, not the publishing attempt.
          RELEASE_TAG=$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"
          const { build } = JSON.parse(readFileSync("release/update-manifest.json", "utf8"))
          if (build.repository !== "YakiHugo/yakitori" ||
              build.channel !== "main" || build.dirty !== false ||
              build.commit !== process.env.GITHUB_SHA ||
              build.buildNumber !== Number(process.env.GITHUB_RUN_NUMBER) ||
              !Number.isSafeInteger(build.buildAttempt) || build.buildAttempt < 1 ||
              build.buildAttempt > Number(process.env.GITHUB_RUN_ATTEMPT)) {
            throw new Error("Desktop artifact identity does not match this validated CI run.")
          }
          console.log(`desktop-main-${build.buildNumber}-${build.buildAttempt}`)
          NODE
          )
          printf 'Desktop main build from commit %s.\n\nValidated by the complete required CI suite.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/desktop-release-body.md"
          # Each run attempt has its own tag. Creation fails if it already
          # exists; published assets are never replaced by a rerun.
          gh release create "$RELEASE_TAG" \
            release/yakitori-macos-arm64.tar release/update-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/desktop-release-body.md"
