name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install ripgrep
        run: |
          if command -v rg; then exit 0; fi
          # ripgrep comes from Ubuntu; unrelated runner repositories must not
          # block its installation when their indexes are temporarily broken.
          ubuntu_sources=(
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources"
            -o Dir::Etc::sourceparts="-"
          )
          sudo apt-get "${ubuntu_sources[@]}" update
          sudo apt-get "${ubuntu_sources[@]}" install --yes ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check
